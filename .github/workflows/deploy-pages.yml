name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # NB : pas de `static_site_generator: next` — il écrase next.config et supprime
      # trailingSlash:true (→ fichiers plats, URLs en 404). Le basePath vient de
      # NEXT_PUBLIC_BASE_PATH ci-dessous, la config du repo est ainsi respectée.
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Pas de cache .next : en output:export, un cache restauré provoque des
      # exports incomplets (seules les routes modifiées sont ré-émises). Build propre à chaque fois.
      - name: Install dependencies
        run: npm ci
      - name: Clean previous build output
        run: rm -rf .next out
      - name: Build with Next.js
        run: npm run build
        env:
          # Domaine personnalisé lapolitiquecestsimple.fr → le site est servi à la RACINE,
          # donc plus de basePath. (Le fichier public/CNAME configure le domaine côté GitHub Pages.)
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
