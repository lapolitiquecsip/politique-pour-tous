name: Enrich Mayors (RNE backfill)

# Backfill PONCTUEL et VÉRIFIÉ des fiches maires (> 3000 hab) depuis le RNE officiel :
# remplit bio.profession + un résumé factuel pour les fiches encore vides, sans rien inventer
# (matching par code INSEE). Voir scripts/enrich-mayors-rne.js
# Déclenchement MANUEL uniquement (données statiques jusqu'aux prochaines municipales).

on:
  workflow_dispatch:

jobs:
  enrich-mayors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run RNE backfill
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/enrich-mayors-rne.js
