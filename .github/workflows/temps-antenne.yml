name: Temps d'antenne des candidats

# Chaque heure : les 50 dernières vidéos de 19 chaînes de télévision et de radio
# (≈ 40 unités de quota YouTube par passage, sur 10 000 gratuites par jour).
# Les grandes chaînes publient plusieurs dizaines de vidéos par jour : un passage
# horaire n'en laisse échapper aucune. Voir scripts/temps-antenne.ts

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: temps-antenne
  cancel-in-progress: false

jobs:
  antenne:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Relevé des passages
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npx --yes tsx scripts/temps-antenne.ts
