name: Suivi des commissions parlementaires

# Alimente la fonctionnalité Pro « suivi des commissions » :
#   1. ingestion des comptes rendus de commission du Sénat (senat.fr, Licence Ouverte) ;
#   2. génération de l'analyse détaillée des réunions qui n'en ont pas encore,
#      Sénat comme Assemblée (l'Assemblée est ingérée par le repo backend).
# Voir scripts/update-commissions.ts

on:
  schedule:
    # QUATRE passages par jour, groupés APRÈS 07h00 UTC : c'est l'heure où le quota
    # gratuit Gemini (500 requêtes par modèle et par jour) se remet à zéro. Les anciens
    # créneaux, calés sur les heures creuses DeepSeek (04h40, 18h, 22h), tombaient sur
    # un quota déjà vidé par les autres tâches : des réunions restaient des semaines
    # sans analyse (« Analyse en cours de génération »).
    - cron: '30 7 * * *'    # 09h30 Paris
    - cron: '0 10 * * *'    # 12h00 Paris
    - cron: '0 13 * * *'    # 15h00 Paris
    - cron: '0 16 * * *'    # 18h00 Paris
  workflow_dispatch:
    inputs:
      weeks:
        description: "Nombre de semaines à remonter côté Sénat (rattrapage)"
        required: false
        default: "3"
      analyses:
        description: "Nombre maximum d'analyses IA à générer sur ce passage"
        required: false
        default: "40"

# Deux exécutions simultanées analyseraient les mêmes réunions deux fois.
concurrency:
  group: commissions
  cancel-in-progress: false

jobs:
  commissions:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ingestion + analyse des commissions
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Moteur d'analyse : Google AI Studio GRATUIT (scripts/lib/llm.ts). Cette clé
          # manquait ici : le script retombait sur DeepSeek, compte à découvert, et
          # chaque passage échouait depuis le 29/09 — réunions laissées sans analyse.
          LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
          # Secours payant facultatif.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Facultatif : bascule vers un modèle moins cher (deepseek-flash) sans toucher au code.
          COMMISSION_MODEL: ${{ vars.COMMISSION_MODEL }}
        run: >
          npx --yes tsx scripts/update-commissions.ts
          --weeks=${{ github.event.inputs.weeks || '3' }}
          --analyses=${{ github.event.inputs.analyses || '40' }}
          --concurrency=4
          --offpeak-only
