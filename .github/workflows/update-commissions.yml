name: Suivi des commissions parlementaires

# Alimente la fonctionnalité Pro « suivi des commissions » :
#   1. ingestion des comptes rendus de commission du Sénat (senat.fr, Licence Ouverte) ;
#   2. génération de l'analyse détaillée des réunions qui n'en ont pas encore,
#      Sénat comme Assemblée (l'Assemblée est ingérée par le repo backend).
# Voir scripts/update-commissions.ts

on:
  schedule:
    # 04:40 UTC ≈ 06:40 Paris. Créneau choisi pour DEUX raisons :
    #  - DeepSeek facture MOITIÉ PRIX hors heures de pointe, et ses heures pleines sont
    #    01h-04h et 06h-10h UTC en semaine : 04h40 tombe dans le creux entre les deux ;
    #  - c'est hors de la fenêtre du cron backend (17h-04h UTC).
    - cron: '40 4 * * *'
  workflow_dispatch:
    inputs:
      weeks:
        description: "Nombre de semaines à remonter côté Sénat (rattrapage)"
        required: false
        default: "3"
      analyses:
        description: "Nombre maximum d'analyses IA à générer sur ce passage"
        required: false
        default: "20"

# Deux exécutions simultanées analyseraient les mêmes réunions deux fois.
concurrency:
  group: commissions
  cancel-in-progress: false

jobs:
  commissions:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ingestion + analyse des commissions
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Moteur d'analyse : DeepSeek (voir scripts/update-commissions.ts).
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Facultatif : bascule vers un modèle moins cher (deepseek-flash) sans toucher au code.
          COMMISSION_MODEL: ${{ vars.COMMISSION_MODEL }}
        run: >
          npx --yes tsx scripts/update-commissions.ts
          --weeks=${{ github.event.inputs.weeks || '3' }}
          --analyses=${{ github.event.inputs.analyses || '20' }}
