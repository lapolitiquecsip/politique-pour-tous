name: Suivi des commissions parlementaires

# Alimente la fonctionnalité Pro « suivi des commissions » :
#   1. ingestion des comptes rendus de commission du Sénat (senat.fr, Licence Ouverte) ;
#   2. génération de l'analyse détaillée des réunions qui n'en ont pas encore,
#      Sénat comme Assemblée (l'Assemblée est ingérée par le repo backend).
# Voir scripts/update-commissions.ts

on:
  schedule:
    # QUATRE passages par jour, pour qu'une nouvelle commission soit analysée dans les
    # heures qui suivent sa publication plutôt que le lendemain.
    #
    # Tous les créneaux sont en HEURES CREUSES DeepSeek (tarif moitié prix). Ses heures
    # pleines sont 01h-04h et 06h-10h UTC, du lundi au vendredi : 04h40 tombe dans le
    # creux entre les deux fenêtres, les trois autres sont largement hors pointe.
    # Le script refuse de toute façon d'analyser en heures pleines (--offpeak-only).
    - cron: '40 4 * * *'    # 06h40 Paris
    - cron: '0 12 * * *'    # 14h00 Paris
    - cron: '0 18 * * *'    # 20h00 Paris
    - cron: '0 22 * * *'    # 00h00 Paris
  workflow_dispatch:
    inputs:
      weeks:
        description: "Nombre de semaines à remonter côté Sénat (rattrapage)"
        required: false
        default: "3"
      analyses:
        description: "Nombre maximum d'analyses IA à générer sur ce passage"
        required: false
        default: "30"

# Deux exécutions simultanées analyseraient les mêmes réunions deux fois.
concurrency:
  group: commissions
  cancel-in-progress: false

jobs:
  commissions:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ingestion + analyse des commissions
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Moteur d'analyse : DeepSeek (voir scripts/update-commissions.ts).
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Facultatif : bascule vers un modèle moins cher (deepseek-flash) sans toucher au code.
          COMMISSION_MODEL: ${{ vars.COMMISSION_MODEL }}
        run: >
          npx --yes tsx scripts/update-commissions.ts
          --weeks=${{ github.event.inputs.weeks || '3' }}
          --analyses=${{ github.event.inputs.analyses || '30' }}
          --concurrency=4
          --offpeak-only
