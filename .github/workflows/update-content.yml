name: Update Content Feed (daytime)

# Rafraîchit le fil d'actualité de l'accueil EN JOURNÉE. L'ingestion historique (repo backend)
# tourne le soir/la nuit (~19h-06h Paris), donc en journée le fil montrait la veille. Ces passages
# matin + midi comblent le trou. Dédup sur source_url → aucun doublon même en parallèle du backend.
# Voir scripts/run-content-ingestion.ts

on:
  schedule:
    # Après 07:00 UTC, heure de remise à zéro du quota gratuit Gemini : 07:40 UTC (≈ 9h40
    # Paris), 11:10 et 15:10 UTC. L'IA gratuite fait désormais le travail (Claude en secours).
    - cron: '40 7 * * *'
    - cron: '10 11 * * *'
    - cron: '10 15 * * *'
  workflow_dispatch: # déclenchement manuel depuis l'UI GitHub

jobs:
  ingest-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run content ingestion
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # IA gratuite (Google AI Studio) ; Claude seulement en secours, si la clé existe.
          LLM_FREE_API_KEY: ${{ secrets.LLM_FREE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Secours si Gemini échoue : deepseek-v4-flash si LLM_SECOURS_PAYANT=1, puis
          # FIL_ACCUEIL_SECOURS (« titres-bruts » par défaut, « aucun », ou « claude » = ancien comportement).
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_SECOURS_PAYANT: ${{ vars.LLM_SECOURS_PAYANT }}
          FIL_ACCUEIL_SECOURS: ${{ vars.FIL_ACCUEIL_SECOURS }}
        run: npx --yes tsx scripts/run-content-ingestion.ts
